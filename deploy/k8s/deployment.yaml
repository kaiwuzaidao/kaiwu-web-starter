apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiwu-purchase-desk-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaiwu-purchase-desk-web
  template:
    metadata:
      labels:
        app: kaiwu-purchase-desk-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: kaiwu-purchase-desk-web:replace-me
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /apps/purchase-desk/, port: http }
          livenessProbe:
            httpGet: { path: /apps/purchase-desk/, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
