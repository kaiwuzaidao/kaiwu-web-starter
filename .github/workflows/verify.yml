name: Verify product frontend

on:
  pull_request:
  push:
    branches: [main, dev, product, 'handoff/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify blank and purchase initialization
        if: ${{ hashFiles('.kaiwu-starter') != '' }}
        run: node --test tests/init.test.mjs
      - run: pnpm test:scenarios
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:proxy
      - name: Confirm the production image excludes Mock
        run: |
          docker build -t kaiwu-frontend-check .
          project_code=$(node -p "require('./docs/kaiwu-project-blueprint.json').projectCode")
          sh scripts/check-runtime-image.sh kaiwu-frontend-check "$project_code"
